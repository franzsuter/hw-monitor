name: Hagelregister Daily Scan
on:
  schedule:
    - cron: '0 7 * * *' 
  workflow_dispatch: 

# Scans dürfen sich beim Aktualisieren des Bestands nicht überschneiden.
concurrency:
  group: hagelregister-daily-scan
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    # NEU: Diese zwei Zeilen schalten direkt auf die zukunftssichere Node-Version um
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run regression tests
        env:
          RUN_BROWSER_TESTS: '1'
        run: python -m unittest discover -s tests -v
      - name: Run Scraper
        run: python scraper.py
      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add hagelregister_daten.json history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Hagelregister Daten" && git push)
